[tool.poetry]
name = "markmybench"
version = "0.1.0"
description = "A quantitative and qualitative benchmarking analysis repository for various different things"
authors = ["Asif Sayyed <asifdotexe@gmail.com>"]
readme = "README.md"
packages = [{ include = "rag_vs_pageindex" }, { include = "workbench" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.general_workbench.dependencies]
numpy = "^2.1.3"
matplotlib = "^3.9.3"
seaborn = "^0.13.2"
scikit-learn = "^1.5.2"

[tool.poetry.group.benchmark_rag_pageindex.dependencies]
langchain = "^0.3.0"
faiss-cpu = "^1.8.0"
ragas = "^0.2.0"
pdfplumber = "^0.11.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.2.0"
requests = "^2.32.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
